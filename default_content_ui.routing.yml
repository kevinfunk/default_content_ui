default_content_ui.admin:
  path: '/admin/config/development/default-content'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: 'Default Content'
  requirements:
    _permission: 'administer site configuration'

default_content_ui.settings:
  path: '/admin/config/development/default-content/settings'
  defaults:
    _form: '\Drupal\default_content_ui\Form\SettingsForm'
    _title: 'Settings'
  requirements:
    _permission: 'administer site configuration'

default_content_ui.import:
  path: '/admin/config/development/default-content/import'
  defaults:
    _form: '\Drupal\default_content_ui\Form\ImportForm'
    _title: 'Import Content'
  requirements:
    _permission: 'default content import'

default_content_ui.export_bulk:
  path: '/admin/config/development/default-content/export'
  defaults:
    _form: '\Drupal\default_content_ui\Form\ExportBulkForm'
    _title: 'Export Content'
  requirements:
    _permission: 'default content export'

default_content_ui.export_download:
  path: '/admin/config/development/default-content/export/download'
  defaults:
    _controller: 'Drupal\default_content_ui\Controller\ExportDownloadController::downloadExport'
  requirements:
    _permission: 'default content export'
